x-runner: &runner
  image: ${RINDEXER_RUNNER_IMAGE:?prepare the development image}
  pull_policy: never
  platform: linux/amd64
  user: '65532:65532'
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 512
  mem_limit: 6g
  cpus: 2
  working_dir: /work
  environment:
    CARGO_TERM_COLOR: never
  volumes:
    - type: bind
      source: ${RINDEXER_SOURCE_TAR:?}
      target: /input/source.tar
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: ${RINDEXER_ROOT:?}/containers/development/run.sh
      target: /input/run.sh
      read_only: true
      bind: {create_host_path: false}
    - type: volume
      source: build
      target: /build
  tmpfs:
    - /work:rw,nosuid,nodev,noexec,mode=1777,size=3072m
    - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=512m
  entrypoint: [bash, /input/run.sh]

services:
  offline:
    <<: *runner
    network_mode: none
  postgres-tests:
    <<: *runner
    environment:
      CARGO_TERM_COLOR: never
      RINDEXER_TEST_POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/rindexer_fixture_admin
    networks: [fixtures]
  postgres:
    image: ${POSTGRES_IMAGE:?missing pinned PostgreSQL image}
    pull_policy: never
    platform: linux/amd64
    user: '999:999'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rindexer_fixture_admin
    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,nodev,noexec,uid=999,gid=999,mode=0700,size=512m
      - /var/run/postgresql:rw,nosuid,nodev,noexec,uid=999,gid=999,mode=0700,size=16m
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=16m
    networks: [fixtures]
    healthcheck:
      # The initdb bootstrap server is socket-only. Require the final TCP listener.
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d rindexer_fixture_admin']
      interval: 2s
      timeout: 2s
      retries: 30

networks:
  fixtures:
    internal: true
volumes:
  build:
    external: true
    name: ${RINDEXER_BUILD_VOLUME:?}
