name: Helm deployment checks

on:
  pull_request:
    paths:
      - "helm/**"
      - ".github/workflows/helm.yml"
  push:
    branches: [master]
    paths:
      - "helm/**"
      - ".github/workflows/helm.yml"

permissions:
  contents: read

jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Helm
        env:
          HELM_VERSION: v3.19.0
        run: |
          curl --fail --silent --show-error --location --output helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --output helm.sha256 "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
          sed "s/helm-${HELM_VERSION}-linux-amd64.tar.gz/helm.tar.gz/" helm.sha256 | sha256sum --check -
          tar -xzf helm.tar.gz linux-amd64/helm
      - name: Check deployment admission and replacement
        run: python3 helm/rindexer/tests/deployment.py "$PWD/linux-amd64/helm"
